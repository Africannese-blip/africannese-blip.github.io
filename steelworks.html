        body {

        /* =====================================================

           ===================================================== */

        .navbar {

            letter-spacing: 4px;

            margin-top: 6px;

        }

            display: flex;

            font-size: 12px;

            font-weight: 800;

            transition: .25s ease;

        }


        .nav-links a:hover {

            background: var(--gold);

            color: #000000;

        }


        .nav-links .active {

            background: var(--gold);

            color: #000000;

        }

            transform:

        }
