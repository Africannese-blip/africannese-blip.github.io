<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Africannese Group</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 30px 6%;
            border-bottom: 1px solid #222;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .brand span {
            display: block;
            margin-top: 5px;
            color: #f5c900;
            font-size: 8px;
            letter-spacing: 5px;
        }

        .hero {
            min-height: 75vh;
            padding: 110px 6%;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 1000px;
        }

        .label {
            color: #f5c900;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(50px, 8vw, 100px);
            line-height: .95;
            letter-spacing: -4px;
            text-transform: uppercase;
        }

        h1 span {
            color: #f5c900;
        }

        p {
            max-width: 600px;
            margin-top: 30px;
            color: #999;
            font-size: 16px;
            line-height: 1.8;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 35px;
        }

        .button {
            padding: 16px 24px;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .yellow {
            background: #f5c900;
            color: #000;
        }

        .outline {
            border: 1px solid #555;
            color: white;
        }

        @media(max-width:600px) {
            .hero {
                min-height: 75vh;
                padding: 80px 6%;
            }

            h1 {
                font-size: 52px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
            }

            .button {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        AFRICANNESE
        <span>GROUP</span>
    </div>
</header>

<section class="hero">

    <div class="hero-content">

        <div class="label">
            ENGINEERING • CONSTRUCTION • BRANDING
        </div>

        <h1>
            Building Africa<br>
            Through <span>Excellence.</span>
        </h1>

        <p>
            Professional steelworks, construction, corporate wear,
            digital branding and business solutions delivered with
            precision, quality and purpose.
        </p>

        <div class="buttons">

            <a href="quote.html" class="button yellow">
                Request a Quote
            </a>

            <a href="projects.html" class="button outline">
                View Projects
            </a>

        </div>

    </div>

</section>

</body>
</html>
